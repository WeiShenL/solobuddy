name: Automated Release (Web Docker & Android APK)

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-ghcr-web-image:
    name: Build & Push Caddy Web Image to GHCR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image for Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/weishenl/solobuddy-web:latest
            ghcr.io/weishenl/solobuddy-web:${{ github.sha }}

  build-android-apk:
    name: Build & Release Android APK
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # PR label decides the bump: "major" -> 2.0.0, "minor" -> 1.1.0, "patch" or no label -> 1.0.13
      # if several are set the biggest wins (major > minor > patch)
      - name: Bump version
        id: bump
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          CURRENT=$(grep -m1 -oE 'version: *"[0-9]+\.[0-9]+\.[0-9]+"' app.config.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          case ",$PR_LABELS," in
            *,major,*) BUMP=major ;;
            *,minor,*) BUMP=minor ;;
            *) BUMP=patch ;; # "patch" label or no label
          esac
          NEW=$(node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const bump = process.argv[2];
            if (bump === "major") console.log(`${major + 1}.0.0`);
            else if (bump === "minor") console.log(`${major}.${minor + 1}.0`);
            else console.log(`${major}.${minor}.${patch + 1}`);
          ' "$CURRENT" "$BUMP")
          echo "Bumping $CURRENT -> $NEW ($BUMP, labels: ${PR_LABELS:-none})"
          sed -i "s/version: \"$CURRENT\"/version: \"$NEW\"/" app.config.js
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build APK on EAS
        run: |
          set -o pipefail
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build.log

      - name: Extract APK URL
        id: extract
        run: |
          eas build:list --platform android --limit 1 --status finished --non-interactive --json > build-output.json
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build-output.json'))[0].artifacts.buildUrl")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o solobuddy.v${{ steps.bump.outputs.version }}.apk "${{ steps.extract.outputs.apk_url }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.config.js
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Create Git tag
        run: |
          git tag v${{ steps.bump.outputs.version }}
          git push origin v${{ steps.bump.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Solobuddy v${{ steps.bump.outputs.version }}
          target_commitish: main
          body: |
            SoloBuddy is a travel companion app built for travellers.
            Latest Version: v${{ steps.bump.outputs.version }}
            Android only APK, sideload.
          files: solobuddy.v${{ steps.bump.outputs.version }}.apk
