name: Build and Release Android APK

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(node -p "require('./app.config.js').default.expo.version")
          NEW=$(node -e "
            const p = '$CURRENT'.split('.').map(Number);
            p[2] += 1;
            console.log(p.join('.'));
          ")
          sed -i "s/version: \"$CURRENT\"/version: \"$NEW\"/" app.config.js
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.config.js
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-output.json

      - name: Extract APK URL
        id: extract
        run: |
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build-output.json'))[0].artifacts.buildUrl")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o app.apk "${{ steps.extract.outputs.apk_url }}"

      - name: Create Git tag
        run: |
          git tag v${{ steps.bump.outputs.version }}
          git push origin v${{ steps.bump.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          files: app.apk
          generate_release_notes: true
