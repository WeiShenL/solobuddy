name: CI Build Verification

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verification:
    name: Build & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Linter
        run: npm run lint

      - name: Validate Expo Configuration
        run: npx expo config --type public

      - name: Verify Web Production Build
        env:
          # Mock 39-character placeholder starting with AIzaSy to satisfy Firebase Auth SDK format validation during build verification
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyA1b2C3d4E5f6G7h8I9j0K1HELLO4O5p6Q
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: __EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN__
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: __EXPO_PUBLIC_FIREBASE_PROJECT_ID__
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: __EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET__
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: __EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID__
          EXPO_PUBLIC_FIREBASE_APP_ID: __EXPO_PUBLIC_FIREBASE_APP_ID__
        run: npx expo export --platform web
