name: Build and Release Android APK

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(grep -m1 -oE 'version: *"[0-9]+\.[0-9]+\.[0-9]+"' app.config.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NEW=$(node -e "
            const p = '$CURRENT'.split('.').map(Number);
            p[2] += 1;
            console.log(p.join('.'));
          ")
          sed -i "s/version: \"$CURRENT\"/version: \"$NEW\"/" app.config.js
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build.log

      - name: Extract APK URL
        id: extract
        run: |
          eas build:list --platform android --limit 1 --status finished --non-interactive --json > build-output.json
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build-output.json'))[0].artifacts.buildUrl")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o solobuddy.v${{ steps.bump.outputs.version }}.apk "${{ steps.extract.outputs.apk_url }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.config.js
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Create Git tag
        run: |
          git tag v${{ steps.bump.outputs.version }}
          git push origin v${{ steps.bump.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Solobuddy v${{ steps.bump.outputs.version }}
          target_commitish: main
          body: |
            SoloBuddy is a travel companion app built for travellers.
            Latest Version: v${{ steps.bump.outputs.version }}
            Android only APK, sideload.
          files: solobuddy.v${{ steps.bump.outputs.version }}.apk
